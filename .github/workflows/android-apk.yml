name: Código Zero — Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Compilar Código Zero para Android
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Baixar Código Zero
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir sintaxe e 79 microaulas
        run: |
          node --check aulas-zero-1.js
          node --check aulas-zero-2.js
          node --check app-zero.js
          node --check cloud-sync.js
          node tests/verify-zero.mjs

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências Android
        run: npm install --no-audit --no-fund

      - name: Empacotar todas as aulas, exercícios e Tutor
        run: npm run build:android-web

      - name: Criar projeto nativo Android
        run: npx cap add android

      - name: Sincronizar arquivos no Android
        run: npx cap sync android

      - name: Gerar ícones Android exclusivos do Código Zero
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#071b32' --iconBackgroundColorDark '#071b32' --splashBackgroundColor '#071b32' --splashBackgroundColorDark '#071b32'

      - name: Compilar APK de instalação (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Conferir APK gerado
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Codigo-Zero-Avancado-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
